# Main settings
INSTALL_PATH="${QEMU_HOME}/machines"

# Defaults
DEF_NAME="QEMU_VM"
FLOPPY_ONE="a"
FLOPPY_TWO="b"
HDISK="c"
DISK="d"
PXE="n"
# DEF_CDROM=""
DEF_FILE_FMT="qcow2"
DEF_FILE_NAME="disk"
DEF_FILE_SIZE="10G"
DEF_FILE="${DEF_FILE_NAME}.${DEF_FILE_FMT}"
DEF_RAM_SIZE="4G"
DEF_CPU_CORES="2"
DEF_NET_MODE="user"
DEF_NET_ID="net0"
DEF_PF_PROTO="tcp"
DEF_PF_HPORT="2222"
DEF_PF_GPORT="22"
# DEF_NET_FWD="hostfwd"
DEF_PF_RULE="${DEF_PF_PROTO}::${DEF_PF_HPORT}-:${DEF_PF_GPORT}"
DEF_NET_ADAP="e1000"
DEF_NET_CARD="${DEF_NET_ID}"
DEF_DISP_BACK="default"
DEF_DISP_CURS="show-cursor=on"

DEF_MEM_OPTS="${DEF_RAM}"
DEF_SMP_OPTS="${DEF_CPU_CORES}"
DEF_BOOT_OPTS="menu=on,order=${CDROM}${HDISK}"
DEF_DRIVE_OPTS="file=${DEF_FILE},format=${DEF_FILE_FMT}"
DEF_NETDEV_OPTS="${DEF_NET_MODE},id={DEF_NET_ID},hostfwd=${DEF_PF_RULE}"
DEF_DEVICE_OPTS="${DEF_NET_ADAP},netdev=${DEF_NET_CARD}"
DEF_DISPLAY_OPTS="${DEF_DISP_BACK},${DEF_DISP_CURS}"
DEF_VGA_OPT="virtio"



